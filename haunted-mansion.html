<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Haunted Mansion 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  :root{--orange:#ff8a1c;--purple:#7a3cff;--blood:#c40018;--ink:#f3e9d8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#05030a;color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16px;background:radial-gradient(ellipse at center,rgba(20,6,30,.55),rgba(0,0,0,.92));z-index:20}
  .screen.hidden{display:none}
  h1{font-family:Creepster,cursive;font-weight:400;font-size:clamp(44px,10vw,96px);margin:0;color:var(--orange);
    letter-spacing:.04em;text-shadow:0 0 18px #ff5a00,0 0 40px #8a00ff;line-height:1}
  .sub{font-size:clamp(18px,4.4vw,28px);margin:.4em 0 1em;color:#e8d6ff;text-shadow:0 0 10px #7a3cff}
  .how{max-width:520px;font-size:14px;line-height:1.9;color:#cbbfd8;background:rgba(0,0,0,.35);border:1px solid #3a2550;
    border-radius:10px;padding:12px 18px;margin-bottom:22px}
  .how b{color:var(--orange)}
  button.big{font:inherit;font-size:20px;padding:14px 38px;border-radius:40px;border:2px solid var(--orange);cursor:pointer;
    background:linear-gradient(#3a1200,#140500);color:#ffd9a8;box-shadow:0 0 20px rgba(255,120,0,.5);transition:transform .15s}
  button.big:hover{transform:scale(1.06)}
  #hud{position:fixed;top:12px;left:12px;z-index:5;font-size:18px;text-shadow:0 0 6px #000,0 0 12px #000;pointer-events:none}
  #candy{font-size:22px;color:#ffd27a}
  #room{margin-top:4px;font-size:15px;color:#cdb8ff;opacity:0;transition:opacity .8s}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;color:#a99bb8;z-index:5;
    text-shadow:0 0 6px #000;pointer-events:none;white-space:nowrap}
  #msg{position:fixed;left:0;right:0;top:28%;text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .5s;padding:0 16px}
  #msg h2{margin:0;font-size:clamp(28px,7vw,54px);color:#ff2a3a;text-shadow:0 0 14px #ff0000,0 0 30px #600}
  #msg p{margin:.5em 0 0;font-size:clamp(15px,3.6vw,22px);color:#f1e3ff;text-shadow:0 0 8px #000}
  #flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:#fff}
  #vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
  #cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,220,180,.6);z-index:5;pointer-events:none}
  #joy{position:fixed;left:22px;bottom:34px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,160,60,.45);
    background:rgba(40,10,60,.25);z-index:7;display:none}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
    background:radial-gradient(#ffb25a,#a24400);opacity:.8}
  .tbtn{position:fixed;z-index:7;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,160,60,.5);
    background:rgba(40,10,60,.4);color:#fff;font-size:24px;display:none}
  #btnLight{right:22px;bottom:110px}
  #btnRun{right:22px;bottom:34px;font-size:14px}
  body.touch #joy,body.touch .tbtn{display:block}
  body.touch #hint{display:none}
  .stat{font-size:20px;margin:.3em 0 1.2em;color:#ffe4b8}
</style>
</head>
<body>
<div id="hud"><div id="candy">🍬 0 / 6</div><div id="room"></div></div>
<div id="hint">WASD 移動 ・ マウス 視点 ・ Shift 走る ・ F 懐中電灯</div>
<div id="cross"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="msg"><h2></h2><p></p></div>
<div id="joy"><div id="knob"></div></div>
<button class="tbtn" id="btnLight">🔦</button>
<button class="tbtn" id="btnRun">RUN</button>

<div class="screen" id="start">
  <h1>Haunted Mansion</h1>
  <div class="sub">〜 ハロウィンの夜の洋館 〜</div>
  <div class="how">
    10月31日の夜。丘の上の古い洋館に、灯りがともっている…。<br>
    館の中に隠された <b>キャンディ6つ</b> を集めて、生きて脱出せよ。<br>
    <span style="opacity:.8">PC：<b>WASD</b> 移動 / <b>マウス</b> 視点 / <b>Shift</b> 走る / <b>F</b> 懐中電灯<br>
    スマホ：左スティックで移動 / 画面右側をドラッグで視点</span><br>
    🎧 音ありでどうぞ
  </div>
  <button class="big" id="go">館へ入る</button>
</div>
<div class="screen hidden" id="pause">
  <h1 style="font-size:56px">Paused</h1>
  <div class="sub">クリックで再開</div>
</div>
<div class="screen hidden" id="win">
  <h1>You Escaped!</h1>
  <div class="sub">洋館からの脱出に成功した…</div>
  <div class="stat" id="winStat"></div>
  <button class="big" onclick="location.reload()">もう一度</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
// ================================================================
//  基本セットアップ
// ================================================================
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.25 : 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x0b0618);
scene.background = SKY.clone();
scene.fog = new THREE.FogExp2(0x0c0716, 0.035);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.6, 24);
scene.add(camera);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let seed = 31;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const rr = (a, b) => a + (b - a) * rnd();

// ================================================================
//  テクスチャ（すべてCanvasで生成）
// ================================================================
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
function grime(g, w, h, n, col, maxR) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = col.replace('A', (Math.random() * 0.12).toFixed(3));
    g.beginPath(); g.arc(Math.random() * w, Math.random() * h, Math.random() * maxR, 0, 7); g.fill();
  }
}
function wallpaperTex(bg, fg, stripe) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = stripe;
    for (let x = 0; x < w; x += 64) g.fillRect(x + 30, 0, 4, h);
    g.fillStyle = fg;
    for (let y = 0; y < 2; y++) for (let x = 0; x < 4; x++) {
      const cx = x * 64 + 0, cy = y * 128 + (x % 2 ? 64 : 0) + 32;
      g.beginPath(); g.moveTo(cx, cy - 26); g.quadraticCurveTo(cx + 20, cy, cx, cy + 26);
      g.quadraticCurveTo(cx - 20, cy, cx, cy - 26); g.fill();
      g.beginPath(); g.arc(cx, cy - 34, 5, 0, 7); g.fill();
      g.beginPath(); g.arc(cx, cy + 34, 5, 0, 7); g.fill();
      if (cx === 0) { g.save(); g.translate(w, 0); g.beginPath(); g.moveTo(0, cy - 26); g.quadraticCurveTo(-20, cy, 0, cy + 26); g.fill(); g.restore(); }
    }
    grime(g, w, h, 160, 'rgba(0,0,0,A)', 18);
  });
}
const woodFloorTex = canvasTex(256, 256, (g, w, h) => {
  for (let r = 0; r < 8; r++) {
    const off = (r * 97) % 256;
    for (let k = -1; k < 2; k++) {
      const l = 30 + Math.random() * 20;
      g.fillStyle = `rgb(${l + 30},${l + 12},${l - 5})`;
      g.fillRect(off + k * 256, r * 32, 256, 32);
    }
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, r * 32, w, 2); g.fillRect(off, r * 32, 2, 32);
    g.strokeStyle = 'rgba(20,8,0,.35)';
    for (let i = 0; i < 6; i++) { g.beginPath(); const y = r * 32 + 4 + Math.random() * 26; g.moveTo(0, y); g.bezierCurveTo(80, y + 3, 160, y - 3, 256, y); g.stroke(); }
  }
  grime(g, w, h, 80, 'rgba(0,0,0,A)', 20);
});
const darkWoodTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#2a170c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(0,0,0,.35)';
  for (let i = 0; i < 26; i++) { g.beginPath(); const x = Math.random() * w; g.moveTo(x, 0); g.bezierCurveTo(x + 6, 40, x - 6, 90, x + 3, h); g.stroke(); }
});
const stoneTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#2b2a30'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = -1; c < 5; c++) {
    const x = c * 64 + (r % 2) * 32, y = r * 32, l = 55 + Math.random() * 30;
    g.fillStyle = `rgb(${l},${l - 3},${l + 6})`; g.fillRect(x + 2, y + 2, 60, 28);
  }
  grime(g, w, h, 260, 'rgba(10,20,10,A)', 14);
});
const chapelFloorTex = canvasTex(256, 256, (g, w, h) => {
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const l = 50 + Math.random() * 25; g.fillStyle = `rgb(${l},${l},${l + 4})`; g.fillRect(x * 64, y * 64, 64, 64);
    g.strokeStyle = '#151318'; g.lineWidth = 3; g.strokeRect(x * 64, y * 64, 64, 64);
  }
  grime(g, w, h, 200, 'rgba(0,0,0,A)', 16);
});
const checkerTex = canvasTex(256, 256, (g, w, h) => {
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    g.fillStyle = (x + y) % 2 ? '#c9c4b0' : '#1d2422'; g.fillRect(x * 32, y * 32, 32, 32);
  }
  grime(g, w, h, 220, 'rgba(30,50,10,A)', 20);
});
const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#121a10'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) {
    const l = Math.random(); g.fillStyle = `rgba(${20 + l * 30},${35 + l * 40},${15 + l * 15},.7)`;
    g.fillRect(Math.random() * w, Math.random() * h, 1.5, 3);
  }
});
const gravelTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#34302c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { const l = 40 + Math.random() * 60; g.fillStyle = `rgb(${l},${l - 4},${l - 8})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});
const ceilingTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#1b120d'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#0a0604'; g.lineWidth = 6; g.strokeRect(0, 0, w, h);
  grime(g, w, h, 60, 'rgba(0,0,0,A)', 20);
});
const carpetTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#5a0710'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#b8862a'; g.fillRect(6, 0, 6, h); g.fillRect(w - 12, 0, 6, h);
  g.fillStyle = '#3a0308';
  g.beginPath(); g.moveTo(64, 20); g.lineTo(90, 64); g.lineTo(64, 108); g.lineTo(38, 64); g.fill();
  grime(g, w, h, 60, 'rgba(0,0,0,A)', 10);
});
const bookTex = canvasTex(256, 384, (g, w, h) => {
  g.fillStyle = '#1e1008'; g.fillRect(0, 0, w, h);
  const rows = 4, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = 8;
    while (x < w - 12) {
      const bw = 8 + Math.random() * 14, bh = rh * (0.6 + Math.random() * 0.3);
      const hue = [0, 20, 30, 120, 210, 270, 40][Math.floor(Math.random() * 7)];
      g.fillStyle = `hsl(${hue},${30 + Math.random() * 40}%,${15 + Math.random() * 20}%)`;
      g.fillRect(x, r * rh + rh - 10 - bh, bw, bh);
      g.fillStyle = 'rgba(220,180,90,.5)'; g.fillRect(x + 2, r * rh + rh - 10 - bh + 10, bw - 4, 2);
      x += bw + 1;
      if (Math.random() < 0.05) x += 20;
    }
    g.fillStyle = '#3a2412'; g.fillRect(0, r * rh + rh - 10, w, 10);
  }
  g.strokeStyle = '#2a170c'; g.lineWidth = 14; g.strokeRect(0, 0, w, h);
});
const doorTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#2b150a'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#140804'; g.lineWidth = 6;
  g.strokeRect(16, 16, w - 32, 100); g.strokeRect(16, 136, w - 32, 104);
  g.fillStyle = '#c8a040'; g.beginPath(); g.arc(w - 18, 130, 6, 0, 7); g.fill();
});
const webTex = canvasTex(256, 256, (g, w, h) => {
  g.strokeStyle = 'rgba(230,230,240,.55)'; g.lineWidth = 1.2;
  const cx = 0, cy = 0;
  for (let a = 0; a <= 8; a++) { const t = a / 8 * Math.PI / 2; g.beginPath(); g.moveTo(cx, cy); g.lineTo(Math.cos(t) * 256, Math.sin(t) * 256); g.stroke(); }
  for (let r = 20; r < 250; r += 22) {
    g.beginPath();
    for (let a = 0; a <= 8; a++) { const t = a / 8 * Math.PI / 2, rr2 = r - (a % 2) * 6; const x = Math.cos(t) * rr2, y = Math.sin(t) * rr2; a ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
});
const glowTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
function windowTex(glass, frame, silhouette) {
  return canvasTex(96, 160, (g, w, h) => {
    g.fillStyle = frame; g.fillRect(0, 0, w, h);
    g.save(); g.beginPath(); g.moveTo(8, h - 8); g.lineTo(8, 48); g.arc(w / 2, 48, w / 2 - 8, Math.PI, 0); g.lineTo(w - 8, h - 8); g.closePath(); g.clip();
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, glass); gr.addColorStop(1, '#000');
    g.fillStyle = glass; g.fillRect(0, 0, w, h); g.globalAlpha = .35; g.fillStyle = gr; g.fillRect(0, 0, w, h); g.globalAlpha = 1;
    if (silhouette) {
      g.fillStyle = '#000';
      g.beginPath(); g.arc(w / 2, 82, 13, 0, 7); g.fill();
      g.beginPath(); g.moveTo(w / 2 - 28, h); g.quadraticCurveTo(w / 2 - 22, 98, w / 2, 96); g.quadraticCurveTo(w / 2 + 22, 98, w / 2 + 28, h); g.fill();
    }
    g.restore();
    g.fillStyle = frame; g.fillRect(w / 2 - 3, 0, 6, h); g.fillRect(0, 90, w, 6); g.fillRect(0, 130, w, 4);
  });
}
function ripTex(text) {
  return canvasTex(128, 160, (g, w, h) => {
    g.fillStyle = '#5c5a60'; g.fillRect(0, 0, w, h);
    grime(g, w, h, 120, 'rgba(20,40,20,A)', 12);
    g.fillStyle = '#26252a'; g.font = 'bold 30px serif'; g.textAlign = 'center';
    g.fillText(text, w / 2, 70);
    g.fillRect(30, 90, 68, 3); g.font = '16px serif'; g.fillText(['1666', '1813', '1899', '1704'][Math.floor(Math.random() * 4)], w / 2, 118);
  });
}
const ripTexs = [ripTex('R.I.P'), ripTex('R.I.P'), ripTex('✝'), ripTex('???')];
const stainedTex = canvasTex(128, 192, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.save(); g.beginPath(); g.moveTo(6, h - 6); g.lineTo(6, 60); g.arc(w / 2, 60, w / 2 - 6, Math.PI, 0); g.lineTo(w - 6, h - 6); g.closePath(); g.clip();
  const cols = ['#a0122a', '#5a1a9a', '#1f3a9a', '#a6741a', '#126a4a', '#7a0a5a'];
  for (let y = 0; y < h; y += 22) for (let x = 0; x < w; x += 22) { g.fillStyle = cols[Math.floor(Math.random() * cols.length)]; g.fillRect(x, y, 21, 21); }
  g.fillStyle = '#e8d070'; g.beginPath(); g.arc(w / 2, 70, 22, 0, 7); g.fill();
  g.fillStyle = '#000'; g.beginPath(); g.arc(w / 2 - 8, 66, 5, 0, 7); g.arc(w / 2 + 8, 66, 5, 0, 7); g.fill();
  g.restore();
  g.strokeStyle = '#000'; g.lineWidth = 3;
  for (let y = 0; y < h; y += 22) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  for (let x = 0; x < w; x += 22) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
});
function portraitTex(v) {
  return canvasTex(256, 320, (g, w, h) => {
    const bg = g.createRadialGradient(128, 130, 10, 128, 160, 200);
    bg.addColorStop(0, ['#3a2a1a', '#2a1a2a', '#1a2a2a', '#2a2a1a'][v]); bg.addColorStop(1, '#050303');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    // 体
    g.fillStyle = ['#120a08', '#2a0a18', '#0a1418', '#181008'][v];
    g.beginPath(); g.moveTo(30, h); g.quadraticCurveTo(40, 200, 128, 190); g.quadraticCurveTo(216, 200, 226, h); g.fill();
    g.fillStyle = '#d8d0c0'; g.beginPath(); g.moveTo(108, 190); g.lineTo(128, 240); g.lineTo(148, 190); g.fill();
    // 髪（後ろ）
    g.fillStyle = ['#1a120a', '#2a1406', '#888', '#0a0a0a'][v];
    if (v === 1) { g.beginPath(); g.ellipse(128, 140, 64, 100, 0, 0, 7); g.fill(); }
    // 顔
    g.fillStyle = ['#c9b49a', '#d8c4b0', '#b8b0a0', '#c0a890'][v];
    g.beginPath(); g.ellipse(128, 120, 44, 58, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(140, 128, 30, 50, 0, 0, 7); g.fill();
    // 髪（前）
    g.fillStyle = ['#1a120a', '#2a1406', '#999', '#0a0a0a'][v];
    g.beginPath(); g.ellipse(128, 76, 48, 26, 0, Math.PI, 0); g.fill();
    if (v === 0) { g.fillStyle = '#080506'; g.fillRect(78, 20, 100, 48); g.fillRect(64, 62, 128, 10); }
    // 目のくぼみ・口
    g.fillStyle = '#1a0e08';
    g.beginPath(); g.ellipse(110, 112, 11, 7, 0, 0, 7); g.ellipse(146, 112, 11, 7, 0, 0, 7); g.fill();
    g.strokeStyle = '#4a1a14'; g.lineWidth = 2; g.beginPath(); g.moveTo(112, 152); g.quadraticCurveTo(128, 148, 144, 152); g.stroke();
    // 額縁
    g.lineWidth = 18; g.strokeStyle = '#8a6220'; g.strokeRect(9, 9, w - 18, h - 18);
    g.lineWidth = 4; g.strokeStyle = '#d4a848'; g.strokeRect(20, 20, w - 40, h - 40);
    grime(g, w, h, 80, 'rgba(0,0,0,A)', 20);
  });
}
function pumpkinTexs() {
  const draw = (g, w, h, glow) => {
    g.fillStyle = glow ? '#000' : '#d8640e'; g.fillRect(0, 0, w, h);
    if (!glow) { g.strokeStyle = 'rgba(90,30,0,.6)'; g.lineWidth = 4; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(i * w / 12, 0); g.lineTo(i * w / 12, h); g.stroke(); } }
    const cx = w * 0.25, col = glow ? '#ffd040' : '#2a0c00';
    g.fillStyle = col;
    g.beginPath(); g.moveTo(cx - 52, 108); g.lineTo(cx - 30, 78); g.lineTo(cx - 12, 108); g.fill();
    g.beginPath(); g.moveTo(cx + 12, 108); g.lineTo(cx + 30, 78); g.lineTo(cx + 52, 108); g.fill();
    g.beginPath(); g.moveTo(cx - 8, 128); g.lineTo(cx, 116); g.lineTo(cx + 8, 128); g.fill();

const colliders = [];
function worldUV(geo, s) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const nx = Math.abs(n.getX(i)), ny = Math.abs(n.getY(i));
    let u, v;
    if (ny > 0.5) { u = p.getX(i); v = p.getZ(i); }
    else if (nx > 0.5) { u = p.getZ(i); v = p.getY(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv.setXY(i, u / s, v / s);
  }
  uv.needsUpdate = true; return geo;
}
// 中心 x,y,z（yは底面）にボックスを置く
function box(w, h, d, x, y, z, m, o = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(x, y + h / 2, z);
  if (o.uv) worldUV(g, o.uv);
  const mesh = new THREE.Mesh(g, m);
  (o.parent || scene).add(mesh);
  if (o.col) colliders.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });
  return mesh;
}
function addCol(x0, x1, z0, z1) { const c = { x0, x1, z0, z1 }; colliders.push(c); return c; }

const WH = 5, WT = 0.3, DH = 3;
function wallX(z, x0, x1, gaps, mp, mn) {
  const mats = [mp, mp, mp, mp, mp, mn];
  let cur = x0; const segs = [];
  for (const [c, w] of gaps) { segs.push([cur, c - w / 2, 0, WH, 1]); segs.push([c - w / 2, c + w / 2, DH, WH, 0]); cur = c + w / 2; }
  segs.push([cur, x1, 0, WH, 1]);
  for (const [a, b, y0, y1, col] of segs) {
    if (b - a < 0.01) continue;
    const g = new THREE.BoxGeometry(b - a, y1 - y0, WT); g.translate((a + b) / 2, (y0 + y1) / 2, z); worldUV(g, 2);
    scene.add(new THREE.Mesh(g, mats));
    if (col) addCol(a, b, z - WT / 2, z + WT / 2);
  }
  for (const [c, w] of gaps) doorFrameX(z, c, w);
}
function wallZ(x, z0, z1, gaps, mp, mn) {
  const mats = [mp, mn, mp, mp, mp, mp];
  let cur = z0; const segs = [];
  for (const [c, w] of gaps) { segs.push([cur, c - w / 2, 0, WH, 1]); segs.push([c - w / 2, c + w / 2, DH, WH, 0]); cur = c + w / 2; }
  segs.push([cur, z1, 0, WH, 1]);
  for (const [a, b, y0, y1, col] of segs) {
    if (b - a < 0.01) continue;
    const g = new THREE.BoxGeometry(WT, y1 - y0, b - a); g.translate(x, (y0 + y1) / 2, (a + b) / 2); worldUV(g, 2);
    scene.add(new THREE.Mesh(g, mats));
    if (col) addCol(x - WT / 2, x + WT / 2, a, b);
  }
  for (const [c, w] of gaps) doorFrameZ(x, c, w);
}
function doorFrameX(z, c, w) {
  box(0.16, DH, WT + 0.12, c - w / 2 - 0.08, 0, z, mat.wood);
  box(0.16, DH, WT + 0.12, c + w / 2 + 0.08, 0, z, mat.wood);
  box(w + 0.32, 0.18, WT + 0.12, c, DH, z, mat.wood);
}
function doorFrameZ(x, c, w) {
  box(WT + 0.12, DH, 0.16, x, 0, c - w / 2 - 0.08, mat.wood);
  box(WT + 0.12, DH, 0.16, x, 0, c + w / 2 + 0.08, mat.wood);
  box(WT + 0.12, 0.18, w + 0.32, x, DH, c, mat.wood);
}
function rect(x0, x1, z0, z1, m, y, down, s = 2) {
  const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0);
  g.rotateX(down ? Math.PI / 2 : -Math.PI / 2);
  g.translate((x0 + x1) / 2, y, (z0 + z1) / 2);
  worldUV(g, s);
  const mesh = new THREE.Mesh(g, m); scene.add(mesh); return mesh;
}

function onRoomEnter(r) {

  if (r === 'dining' && !done.dining) { done.dining = 1; after(0.6, scareDining); }
  if (r === 'library' && !done.library) { done.library = 1; after(0.8, scareLibrary); }
  if (r === 'chapel' && !done.chapel) { done.chapel = 1; after(0.4, scareChapel); }
  if (r === 'lab' && !done.lab) { done.lab = 1; after(0.4, scareLab); }

}
const roomNames = { garden: '墓地の庭', hall: '玄関ホール', dining: '食堂', library: '書斎', bedroom: '寝室', chapel: '礼拝堂', lab: '秘密の実験室' };
function roomAt(x, z) {
  if (z > 0 || x < -15 || x > 15 || z < -24) return 'garden';
  return [['dining', 'hall', 'library'], ['bedroom', 'chapel', 'lab']][z > -12 ? 0 : 1][x < -5 ? 0 : x < 5 ? 1 : 2];

// ================================================================
//  移動・衝突
// ================================================================
function blocked(x, z) {
  const r = 0.3;
  if (x < -35.5 || x > 35.5 || z < -33.5 || z > 29.5) return true;
  for (const c of colliders) if (!c.off && x > c.x0 - r && x < c.x1 + r && z > c.z0 - r && z < c.z1 + r) return true;
  return false;
}
let bobT = 0, lastStep = 0, curRoom = 'garden', heartT = 0;
function updatePlayer(dt) {
  let f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + joy.y;
  let s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
  const l = Math.hypot(f, s); if (l > 1) { f /= l; s /= l; }
  const run = keys.ShiftLeft || keys.ShiftRight || runToggle;
  const sp = (run ? 5.2 : 2.8) * dt;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const dx = (fx * f + rx * s) * sp, dz = (fz * f + rz * s) * sp;
  const p = camera.position;
  if (!blocked(p.x + dx, p.z)) p.x += dx;
  if (!blocked(p.x, p.z + dz)) p.z += dz;
  const moving = l > 0.1;

    bobT += dt * (run ? 13 : 8.5) * Math.min(1, l);

  const r = roomAt(p.x, p.z);

  if (!done.hall && r === 'hall' && p.z < -2.2) { done.hall = 1; scareHall(); }
  if (!done.bedroom && Math.hypot(p.x + 14.2, p.z + 17) < 3.0) { done.bedroom = 1; scareBedroom(); }
  // キャンディ
  for (const c of candies) {
    if (c.taken) continue;
    if (Math.hypot(p.x - c.x, p.z - c.z) < 1.5) {
      c.taken = true; collected++; sfx.chime();
      const g = c.g; tween(0.5, k => { g.scale.setScalar(1 + k); g.position.y = c.y + k; }, () => g.visible = false);
      $('candy').textContent = `🍬 ${collected} / 6`;
      if (collected < 6) showMsg(`キャンディ ${collected} / 6`, 'あと ' + (6 - collected) + ' 個…', 2, '#ffd27a');
      else openEscape();
    }
  }

  const near = Math.min(diningGhost.visible ? p.distanceTo(diningGhost.position) : 99, chapelGhost.visible ? p.distanceTo(chapelGhost.position) : 99, gardenGhost.visible ? p.distanceTo(gardenGhost.position) : 99);

}
function openEscape() {

// ================================================================
//  メインループ
// ================================================================
let time = 0, last = performance.now();
const tmpV = new THREE.Vector3();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;

  if (running) updatePlayer(dt);
  else if (!started) { // タイトル画面のカメラ
    camera.position.set(Math.sin(time * 0.1) * 6, 2.2 + Math.sin(time * 0.3) * 0.3, 26 + Math.cos(time * 0.1) * 2);
    yaw = Math.sin(time * 0.1) * 0.15; pitch = 0.12;
  }

  // 揺れ
  shake = Math.max(0, shake - dt * 1.2);
  camera.rotation.set(pitch + (Math.random() - 0.5) * shake * 0.08, yaw + (Math.random() - 0.5) * shake * 0.08, 0);

  // 屋内外での環境光

  moonLight.intensity += ((inside ? 0.05 : 0.45) - moonLight.intensity) * dt * 2;
  scene.fog.density += ((inside ? 0.05 : 0.035) - scene.fog.density) * dt * 2;
  if (windGain) windGain.gain.value = inside ? 0.05 : 0.11;

  // 雷
  if (started && !won) { nextLightning -= dt; if (nextLightning <= 0) { lightning(); nextLightning = rr(10, 22); } }
  else { nextLightning -= dt; if (nextLightning <= 0) { lightningT = 0.7; nextLightning = rr(8, 14); } }
  if (lightningT > 0) {
    lightningT -= dt;
    const k = (lightningT > 0.55 || (lightningT < 0.4 && lightningT > 0.28)) ? 1 : 0;
    boltLight.intensity = k * 2.2;
    scene.background.copy(SKY).lerp(new THREE.Color(0x8a86b8), k * 0.6);
    insideWindowMats.forEach(m => m.color.setHex(k ? 0xffffff : (m.map === stainedTex ? 0x9a8aa8 : 0x4a5a80)));
  } else boltLight.intensity = 0;

  // 環境音イベント
  if (running) {
    nextAmbient -= dt;
    if (nextAmbient <= 0) {
      nextAmbient = rr(14, 28);
      const r = rnd();
      if (r < 0.3) sfx.creak(rr(0.8, 1.6)); else if (r < 0.5) sfx.whisper(); else if (r < 0.65) sfx.laugh(); else if (r < 0.8) sfx.knock(); else flicker(0.8);
    }
  }

  // ライトのゆらめき
  flickerT = Math.max(0, flickerT - dt);
  for (const k in roomLights) {
    const o = roomLights[k];
    let v = o.base * o.mul * (1 + (Math.random() - 0.5) * o.flick * 2);
    if (flickerT > 0 && k !== 'porch' && k !== 'path') v *= Math.random() < 0.5 ? 0.05 : 1;
    o.l.intensity = v;
  }
  let fi = flashOn ? 1.5 : 0;
  if (flashlight.userData.dead) fi = 0;
  else if (flickerT > 0 && Math.random() < 0.4) fi *= 0.1;
  flashlight.intensity = fi;
  for (const f of flames) { const s = 1 + Math.sin(time * 18 + f.ph) * 0.15 + Math.random() * 0.1; f.m.scale.set(1, s, 1); }
  for (const f of fireFlames) { const s = 0.75 + Math.sin(time * 9 + f.ph) * 0.25 + Math.random() * 0.15; f.f.scale.set(1, s, 1); f.f.position.y = f.h + s * 0.15; }

  // 小物アニメーション
  pendulum.rotation.z = Math.sin(time * 2.6) * 0.25;
  chandelier.rotation.z = Math.sin(time * 0.7) * 0.02;
  for (const c of floatCandles) c.g.position.y = c.y + Math.sin(time * 0.8 + c.ph) * 0.15;
  rockingChair.rotation.x = Math.sin(time * 1.6) * 0.14;
  for (const b of bubbles) { b.position.y += dt * 0.6; if (b.position.y > 2.6) b.position.y = 1.25; }
  cauldronTop.material.color.setHSL(0.36, 1, 0.45 + Math.sin(time * 3) * 0.08);
  for (const c of candies) if (!c.taken) { c.g.rotation.y += dt * 1.5; c.g.position.y = c.y + Math.sin(time * 2 + c.x) * 0.06; }
  for (const m of mists) { m.s.position.x += m.v * dt; if (m.s.position.x > 36) m.s.position.x = -36; }
  for (const b of skyBats) { const u = b.userData; u.a += u.sp * dt; b.position.set(Math.cos(u.a) * u.r, u.h + Math.sin(u.a * 3) * 1.5, -12 + Math.sin(u.a) * u.r); b.rotation.y = -u.a; flap(b, time, 14); }
  // 肖像画の目
  for (const pr of portraits) {
    tmpV.copy(camera.position); pr.g.worldToLocal(tmpV);
    const d = tmpV.length(), nx = tmpV.x / d, ny = tmpV.y / d;
    pr.pupils.forEach(pp => pp.p.position.set(pp.bx + nx * 0.014, pp.by + ny * 0.014, 0.036));
    pr.pupilM.color.setHex(d < 3.2 ? 0xff1010 : 0x000000);
  }
  // 衣装ダンスがガタガタ
  if (!done.bedroom && curRoom === 'bedroom') wardrobeDoor.rotation.y = Math.random() < 0.08 ? rr(0, 0.12) : wardrobeDoor.rotation.y * 0.8;
  if (done.bedroom) {

    b.b.rotation.x += b.w.x * dt; b.b.rotation.y += b.w.y * dt; b.b.rotation.z += b.w.z * dt;
    if (b.b.position.z > -1) { b.b.position.z = -1; b.v.z *= -0.3; }
    if (b.b.position.y < 0.05) { b.b.position.y = 0.05; b.rest = true; b.b.rotation.set(Math.PI / 2, b.b.rotation.y, 0); }
  }

  // 食堂のゴースト
  const gs = ghostState, dg = diningGhost;
  if (dg.userData.chase) {
    // 脱出時：プレイヤーを追いかける（ゆっくり）
    tmpV.copy(camera.position).sub(dg.position); tmpV.y = 0;
    const dist = tmpV.length();
    if (dist > 0.8) dg.position.addScaledVector(tmpV.normalize(), dt * 2.1);
    dg.position.y = 1.6 + Math.sin(time * 2) * 0.15; dg.lookAt(camera.position.x, dg.position.y, camera.position.z);
    if (dist < 1.0 && !gs.hitT) { gs.hitT = 2; flash('#fff', 0.4); shake = 0.5; sfx.moan(); }
    gs.hitT = Math.max(0, (gs.hitT || 0) - dt);
  } else if (gs.mode === 'circle') {
    gs.a += dt * 0.55;
    dg.position.set(-10 + Math.cos(gs.a) * 3.6, 1.7 + Math.sin(time * 1.8) * 0.18, -6 + Math.sin(gs.a) * 3.6);
    dg.lookAt(-10 + Math.cos(gs.a + 0.3) * 3.6, dg.position.y, -6 + Math.sin(gs.a + 0.3) * 3.6);
  } else if (gs.mode === 'rush') {
    const step = dt * 9; gs.traveled += step;
    dg.position.addScaledVector(gs.dir, step);
    dg.lookAt(dg.position.x + gs.dir.x, dg.position.y, dg.position.z + gs.dir.z);
    if (!gs.hit && dg.position.distanceTo(camera.position) < 0.9) { gs.hit = true; flash('#e8f0ff', 0.6); shake = 0.6; sfx.scream(); }
    if (gs.traveled > gs.total) {
      gs.mode = 'fade'; ghostOpacity(dg, 0);
      after(2.5, () => { gs.mode = 'circle'; tween(1.5, k => ghostOpacity(dg, k)); });
    }
  }
  dg.userData.mouth.scale.y = 1 + Math.sin(time * 3) * 0.3;
  // 庭のゴースト
  gardenGhost.position.set(-18 + Math.cos(time * 0.3) * 6, 2.2 + Math.sin(time * 1.3) * 0.3, 15 + Math.sin(time * 0.3) * 6);
  gardenGhost.lookAt(-18 + Math.cos(time * 0.3 + 0.2) * 6, 2.2, 15 + Math.sin(time * 0.3 + 0.2) * 6);
  if (chapelGhost.visible) chapelGhost.position.y += Math.sin(time * 2) * 0.002;

  // 実験室のコウモリ
  if (labBats.active) {
    labBats.t += dt;
    for (const b of labBats) {
      const u = b.userData; u.t += dt;
      if (u.t < 0) continue;
      let target;
      if (u.t < 1.4) target = tmpV.copy(camera.position).add(u.off);
      else target = tmpV.set(10 + u.off.x * 4, 6, -18 + u.off.z * 4);
      const dir = target.clone().sub(b.position); const len = dir.length();
      if (len > 0.05) b.position.addScaledVector(dir.normalize(), Math.min(len, dt * 7.5));
      b.position.y += Math.sin(time * 9 + u.ph) * 0.02;
      b.lookAt(target); flap(b, time);
      if (u.t > 3) b.visible = false;
    }
    if (labBats.t > 4) labBats.active = false;
  }

  // UI
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) msgEl.style.opacity = 0; }
  if (roomTimer > 0) { roomTimer -= dt; if (roomTimer <= 0) roomEl.style.opacity = 0; }
  if (flashA > 0) { flashA = Math.max(0, flashA - dt * 1.4); flashEl.style.opacity = flashA; }

  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

// デバッグ用
window.__mansion = { camera, setPos: (x, z, y) => { camera.position.set(x, 1.6, z); if (y !== undefined) yaw = y; }, start: () => $('go').click(), get state() { return { collected, curRoom, done }; } };
})();
</script>
